map_processor_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /mapping/map
    map_frame: camera_init
    output_directory: maps
    voxel_size: 0.10
    outlier_mean_k: 20
    outlier_stddev_mul: 1.0
    grid_resolution: 0.10
    obstacle_height_min: 0.15
    obstacle_height_max: 1.50

# Starting values: inspect the gravity-aligned map and tune voxel size,
# outlier filter settings, and obstacle height band for the scene.
